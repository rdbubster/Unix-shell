name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build
        run: make

      - name: Run tests
        run: make test
